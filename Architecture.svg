<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1080" width="100%" height="100%" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Arrow Markers -->
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#475569" />
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#0d9488" />
    </marker>
    <marker id="arrow-coral" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#e11d48" />
    </marker>
  </defs>

  <!-- ==================== STAGE 1: FETCH ==================== -->
  <rect x="50" y="65" width="840" height="150" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6 6" />
  <text x="80" y="97" fill="#0f172a" font-size="16" font-weight="700">Stage 1 · fetch</text>

  <!-- pc_reg -->
  <g transform="translate(80, 115)">
    <rect width="190" height="72" rx="12" fill="#4f46e5" stroke="#4338ca" stroke-width="1.5" />
    <text x="95" y="32" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">pc_reg</text>
    <text x="95" y="52" fill="#c7d2fe" font-size="12" font-weight="500" text-anchor="middle">PC, PC+4 mux</text>
  </g>

  <!-- imem -->
  <g transform="translate(350, 115)">
    <rect width="190" height="72" rx="12" fill="#4f46e5" stroke="#4338ca" stroke-width="1.5" />
    <text x="95" y="32" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">imem</text>
    <text x="95" y="52" fill="#c7d2fe" font-size="12" font-weight="500" text-anchor="middle">Instruction memory</text>
  </g>

  <!-- if_id_reg -->
  <g transform="translate(630, 115)">
    <rect width="230" height="72" rx="12" fill="#475569" stroke="#334155" stroke-width="1.5" />
    <text x="115" y="32" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">if_id_reg</text>
    <text x="115" y="52" fill="#cbd5e1" font-size="12" font-weight="500" text-anchor="middle">Pipeline barrier</text>
  </g>

  <!-- Stage 1 Connections -->
  <path d="M 270 151 L 344 151" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow-gray)" />
  <path d="M 540 151 L 624 151" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow-gray)" />

  <!-- Instruction Bus from Stage 1 to Stage 2 -->
  <path d="M 745 187 L 745 240 L 175 240 L 175 299" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow-gray)" />
  <path d="M 445 240 L 445 299" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow-gray)" />
  <path d="M 745 240 L 745 299" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow-gray)" />

  <!-- ==================== STAGE 2: DECODE + EXECUTE ==================== -->
  <rect x="50" y="270" width="840" height="460" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6 6" />
  <text x="80" y="300" fill="#0f172a" font-size="16" font-weight="700">Stage 2 · decode + execute</text>

  <!-- reg_file -->
  <g transform="translate(80, 310)">
    <rect width="190" height="72" rx="12" fill="#4f46e5" stroke="#4338ca" stroke-width="1.5" />
    <text x="95" y="32" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">reg_file</text>
    <text x="95" y="52" fill="#c7d2fe" font-size="12" font-weight="500" text-anchor="middle">32 regs, x0 = 0</text>
  </g>

  <!-- imm_gen -->
  <g transform="translate(350, 310)">
    <rect width="190" height="72" rx="12" fill="#4f46e5" stroke="#4338ca" stroke-width="1.5" />
    <text x="95" y="32" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">imm_gen</text>
    <text x="95" y="52" fill="#c7d2fe" font-size="12" font-weight="500" text-anchor="middle">Sign-extend immediate</text>
  </g>

  <!-- control_unit -->
  <g transform="translate(630, 310)">
    <rect width="230" height="72" rx="12" fill="#4f46e5" stroke="#4338ca" stroke-width="1.5" />
    <text x="115" y="32" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">control_unit</text>
    <text x="115" y="52" fill="#c7d2fe" font-size="12" font-weight="500" text-anchor="middle">+ alu_ctrl_unit</text>
  </g>

  <!-- Eco-Gate -->
  <g transform="translate(80, 430)">
    <rect width="460" height="65" rx="12" fill="#0d9488" stroke="#0f766e" stroke-width="1.5" />
    <text x="230" y="28" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">Eco-Gate</text>
    <text x="230" y="48" fill="#ccfbf1" font-size="12" font-weight="500" text-anchor="middle">Clamps ALU inputs to zero on idle cycles</text>
  </g>

  <!-- alu + cpop -->
  <g transform="translate(80, 530)">
    <rect width="460" height="65" rx="12" fill="#0d9488" stroke="#0f766e" stroke-width="1.5" />
    <text x="230" y="28" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">alu + cpop</text>
    <text x="230" y="48" fill="#ccfbf1" font-size="12" font-weight="500" text-anchor="middle">RV32I ALU + 1-cycle popcount accelerator</text>
  </g>

  <!-- branch_comp -->
  <g transform="translate(630, 430)">
    <rect width="230" height="65" rx="12" fill="#4f46e5" stroke="#4338ca" stroke-width="1.5" />
    <text x="115" y="28" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">branch_comp</text>
    <text x="115" y="48" fill="#c7d2fe" font-size="12" font-weight="500" text-anchor="middle">beq, bne comparator</text>
  </g>

  <!-- id_wb_reg Barrier -->
  <g transform="translate(80, 635)">
    <rect width="780" height="65" rx="12" fill="#475569" stroke="#334155" stroke-width="1.5" />
    <text x="390" y="28" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">id_wb_reg</text>
    <text x="390" y="48" fill="#cbd5e1" font-size="12" font-weight="500" text-anchor="middle">Pipeline barrier (Holds ALU result, write address &amp; store data)</text>
  </g>

  <!-- Operands into Eco-Gate -->
  <path d="M 175 382 L 175 424" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow-gray)" />
  <path d="M 445 382 L 445 424" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow-gray)" />

  <!-- Clean is_alu_op Signal Wire (routed clearly above branch_comp) -->
  <path d="M 700 382 L 700 405 L 546 405 L 546 455" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow-gray)" />
  <text x="590" y="398" fill="#334155" font-size="11" font-weight="600">is_alu_op</text>

  <!-- alu_op Control Signal Wire directly to alu_top -->
  <path d="M 745 382 L 745 555 L 546 555" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow-gray)" />
  <text x="610" y="548" fill="#334155" font-size="11" font-weight="600">alu_op</text>

  <!-- Eco-Gate to ALU -->
  <path d="M 310 495 L 310 524" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow-gray)" />

  <!-- ALU to Barrier -->
  <path d="M 310 595 L 310 629" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow-gray)" />

  <!-- Operands into branch_comp (clean branch from decode) -->
  <path d="M 540 346 L 624 346 L 624 455 L 624 455" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow-gray)" />

  <!-- ==================== STAGE 3: MEMORY + WRITEBACK ==================== -->
  <rect x="50" y="760" width="840" height="170" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6 6" />
  <text x="80" y="792" fill="#0f172a" font-size="16" font-weight="700">Stage 3 · memory + writeback</text>

  <!-- writeback mux -->
  <g transform="translate(80, 815)">
    <rect width="210" height="72" rx="12" fill="#0d9488" stroke="#0f766e" stroke-width="1.5" />
    <text x="105" y="32" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">writeback mux</text>
    <text x="105" y="52" fill="#ccfbf1" font-size="12" font-weight="500" text-anchor="middle">ALU or load data</text>
  </g>

  <!-- dmem -->
  <g transform="translate(420, 815)">
    <rect width="240" height="72" rx="12" fill="#4f46e5" stroke="#4338ca" stroke-width="1.5" />
    <text x="120" y="32" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">dmem</text>
    <text x="120" y="52" fill="#c7d2fe" font-size="12" font-weight="500" text-anchor="middle">lw / sw data RAM</text>
  </g>

  <!-- Direct ALU Result to writeback mux -->
  <path d="M 185 700 L 185 809" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow-gray)" />
  <text x="192" y="745" fill="#0f172a" font-size="12" font-weight="700">alu_result</text>

  <!-- Memory Address and Write Data to dmem -->
  <path d="M 540 700 L 540 809" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow-gray)" />
  <text x="548" y="745" fill="#0f172a" font-size="12" font-weight="700">mem_addr / wdata</text>

  <!-- DMEM read output to Writeback Mux -->
  <path d="M 420 851 L 296 851" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow-gray)" />
  <text x="358" y="842" fill="#0f172a" font-size="12" font-weight="700" text-anchor="middle">rdata</text>

  <!-- ==================== FEEDBACK LOOPS ==================== -->
  <!-- Writeback Loop (Teal) to Regfile -->
  <path d="M 80 851 L 30 851 Q 20 851 20 841 L 20 351 Q 20 341 30 341 L 74 341" fill="none" stroke="#0d9488" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow-teal)" />

  <!-- UNBROKEN Branch Redirect & Flush Loop (Coral) -->
  <!-- Line leaves branch_comp, travels right, up, completely over Stage 1, and drops directly into pc_reg -->
  <path d="M 860 462 L 910 462 Q 920 462 920 452 L 920 40 Q 920 30 910 30 L 185 30 Q 175 30 175 40 L 175 109" fill="none" stroke="#e11d48" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow-coral)" />
  <!-- Flush Tap into if_id_reg -->
  <path d="M 920 151 L 866 151" fill="none" stroke="#e11d48" stroke-width="2.5" marker-end="url(#arrow-coral)" />

  <!-- ==================== BOTTOM LEGEND ==================== -->
  <g transform="translate(180, 975)">
    <line x1="0" y1="0" x2="40" y2="0" stroke="#0d9488" stroke-width="3" />
    <text x="50" y="4" fill="#0f172a" font-size="14" font-weight="600">writeback to reg_file</text>

    <line x1="340" y1="0" x2="380" y2="0" stroke="#e11d48" stroke-width="3" />
    <text x="390" y="4" fill="#0f172a" font-size="14" font-weight="600">branch: redirect PC + flush</text>
  </g>
</svg>
      
