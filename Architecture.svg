<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 1020" width="100%" height="100%" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Arrow Markers -->
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#64748b" />
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#0d9488" />
    </marker>
    <marker id="arrow-coral" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#e11d48" />
    </marker>
  </defs>

  <!-- ==================== STAGE 1: FETCH ==================== -->
  <rect x="50" y="70" width="800" height="150" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6 6" />
  <text x="80" y="102" fill="#0f172a" font-size="16" font-weight="700">Stage 1 · fetch</text>

  <!-- pc_reg -->
  <g transform="translate(80, 120)">
    <rect width="190" height="72" rx="12" fill="#4f46e5" stroke="#4338ca" stroke-width="1.5" />
    <text x="95" y="32" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">pc_reg</text>
    <text x="95" y="52" fill="#c7d2fe" font-size="12" font-weight="500" text-anchor="middle">PC, PC+4 mux</text>
  </g>

  <!-- imem -->
  <g transform="translate(340, 120)">
    <rect width="190" height="72" rx="12" fill="#4f46e5" stroke="#4338ca" stroke-width="1.5" />
    <text x="95" y="32" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">imem</text>
    <text x="95" y="52" fill="#c7d2fe" font-size="12" font-weight="500" text-anchor="middle">Instruction memory</text>
  </g>

  <!-- if_id_reg -->
  <g transform="translate(600, 120)">
    <rect width="220" height="72" rx="12" fill="#475569" stroke="#334155" stroke-width="1.5" />
    <text x="110" y="32" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">if_id_reg</text>
    <text x="110" y="52" fill="#cbd5e1" font-size="12" font-weight="500" text-anchor="middle">Pipeline barrier</text>
  </g>

  <!-- Stage 1 Connections -->
  <path d="M 270 156 L 336 156" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-gray)" />
  <path d="M 530 156 L 596 156" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-gray)" />

  <!-- Connector: Stage 1 to Stage 2 (Decodes instruction bus) -->
  <path d="M 710 192 L 710 245 L 175 245 L 175 321" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-gray)" />
  <path d="M 435 245 L 435 321" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-gray)" />
  <path d="M 710 245 L 710 321" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-gray)" />

  <!-- ==================== STAGE 2: DECODE + EXECUTE ==================== -->
  <rect x="50" y="275" width="800" height="400" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6 6" />
  <text x="80" y="307" fill="#0f172a" font-size="16" font-weight="700">Stage 2 · decode + execute</text>

  <!-- reg_file -->
  <g transform="translate(80, 325)">
    <rect width="190" height="72" rx="12" fill="#4f46e5" stroke="#4338ca" stroke-width="1.5" />
    <text x="95" y="32" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">reg_file</text>
    <text x="95" y="52" fill="#c7d2fe" font-size="12" font-weight="500" text-anchor="middle">32 regs, x0 = 0</text>
  </g>

  <!-- control_unit -->
  <g transform="translate(340, 325)">
    <rect width="190" height="72" rx="12" fill="#4f46e5" stroke="#4338ca" stroke-width="1.5" />
    <text x="95" y="32" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">control_unit</text>
    <text x="95" y="52" fill="#c7d2fe" font-size="12" font-weight="500" text-anchor="middle">+ alu_ctrl_unit</text>
  </g>

  <!-- imm_gen -->
  <g transform="translate(600, 325)">
    <rect width="220" height="72" rx="12" fill="#4f46e5" stroke="#4338ca" stroke-width="1.5" />
    <text x="110" y="32" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">imm_gen</text>
    <text x="110" y="52" fill="#c7d2fe" font-size="12" font-weight="500" text-anchor="middle">I, S, B, U, J formats</text>
  </g>

  <!-- Eco-Gate -->
  <g transform="translate(80, 440)">
    <rect width="190" height="72" rx="12" fill="#0d9488" stroke="#0f766e" stroke-width="1.5" />
    <text x="95" y="32" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">Eco-Gate</text>
    <text x="95" y="52" fill="#ccfbf1" font-size="12" font-weight="500" text-anchor="middle">Clamps ALU inputs</text>
  </g>

  <!-- alu + cpop -->
  <g transform="translate(340, 440)">
    <rect width="190" height="72" rx="12" fill="#0d9488" stroke="#0f766e" stroke-width="1.5" />
    <text x="95" y="32" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">alu + cpop</text>
    <text x="95" y="52" fill="#ccfbf1" font-size="12" font-weight="500" text-anchor="middle">1-cycle popcount</text>
  </g>

  <!-- branch_comp -->
  <g transform="translate(600, 440)">
    <rect width="220" height="72" rx="12" fill="#4f46e5" stroke="#4338ca" stroke-width="1.5" />
    <text x="110" y="32" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">branch_comp</text>
    <text x="110" y="52" fill="#c7d2fe" font-size="12" font-weight="500" text-anchor="middle">beq, bne, slt flags</text>
  </g>

  <!-- id_wb_reg Barrier -->
  <g transform="translate(80, 550)">
    <rect width="740" height="72" rx="12" fill="#475569" stroke="#334155" stroke-width="1.5" />
    <text x="370" y="32" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">id_wb_reg</text>
    <text x="370" y="52" fill="#cbd5e1" font-size="12" font-weight="500" text-anchor="middle">Pipeline barrier (Holds ALU result, write address &amp; store data)</text>
  </g>

  <!-- Stage 2 Internal Dataflow -->
  <path d="M 175 397 L 175 436" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-gray)" />
  <path d="M 270 476 L 336 476" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-gray)" />
  <path d="M 435 397 L 435 436" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-gray)" />
  <path d="M 435 512 L 435 546" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-gray)" />
  <path d="M 710 397 L 710 436" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-gray)" />

  <!-- ==================== STAGE 3: MEMORY + WRITEBACK ==================== -->
  <rect x="50" y="720" width="800" height="160" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6 6" />
  <text x="80" y="752" fill="#0f172a" font-size="16" font-weight="700">Stage 3 · memory + writeback</text>

  <!-- writeback mux -->
  <g transform="translate(80, 775)">
    <rect width="190" height="72" rx="12" fill="#0d9488" stroke="#0f766e" stroke-width="1.5" />
    <text x="95" y="32" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">writeback mux</text>
    <text x="95" y="52" fill="#ccfbf1" font-size="12" font-weight="500" text-anchor="middle">ALU or load data</text>
  </g>

  <!-- dmem -->
  <g transform="translate(380, 775)">
    <rect width="240" height="72" rx="12" fill="#4f46e5" stroke="#4338ca" stroke-width="1.5" />
    <text x="120" y="32" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">dmem</text>
    <text x="120" y="52" fill="#c7d2fe" font-size="12" font-weight="500" text-anchor="middle">lw / sw data RAM</text>
  </g>

  <!-- Stage 2 to Stage 3 SOLID CONNECTIONS -->
  <!-- ALU Result directly into writeback mux -->
  <path d="M 175 622 L 175 771" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow-gray)" />
  <text x="180" y="700" fill="#64748b" font-size="11" font-weight="600">alu_result</text>

  <!-- ALU address and write data directly into dmem -->
  <path d="M 500 622 L 500 771" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow-gray)" />
  <text x="505" y="700" fill="#64748b" font-size="11" font-weight="600">mem_addr / wdata</text>

  <!-- DMEM read output to Writeback Mux -->
  <path d="M 380 811 L 274 811" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-gray)" />
  <text x="327" y="802" fill="#64748b" font-size="11" font-weight="600" text-anchor="middle">rdata</text>

  <!-- ==================== FEEDBACK LOOPS ==================== -->
  <!-- Writeback Loop (Teal) -->
  <path d="M 80 811 L 30 811 Q 20 811 20 801 L 20 371 Q 20 361 30 361 L 76 361" fill="none" stroke="#0d9488" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow-teal)" />

  <!-- Branch / Flush Loop (Coral) -->
  <path d="M 820 476 L 880 476 Q 890 476 890 466 L 890 60 Q 890 50 880 50 L 250 50 Q 240 50 240 60 L 240 116" fill="none" stroke="#e11d48" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-coral)" />
  
  <!-- Flush Tap into if_id_reg -->
  <path d="M 890 156 L 824 156" fill="none" stroke="#e11d48" stroke-width="2" marker-end="url(#arrow-coral)" />

  <!-- ==================== BOTTOM LEGEND ==================== -->
  <g transform="translate(140, 955)">
    <line x1="0" y1="0" x2="40" y2="0" stroke="#0d9488" stroke-width="2.5" />
    <text x="50" y="4" fill="#334155" font-size="13" font-weight="600">writeback to reg_file</text>

    <line x1="330" y1="0" x2="370" y2="0" stroke="#e11d48" stroke-width="2.5" />
    <text x="380" y="4" fill="#334155" font-size="13" font-weight="600">branch: redirect PC + flush</text>
  </g>
</svg>
  
